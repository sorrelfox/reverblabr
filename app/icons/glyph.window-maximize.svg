<!-- Maximise (for the window's own title bar): a chevron pointing up, drawn
     at 22 pixels in a 28-pixel button, as the desktop's own title bars draw
     it. The prototype has this and restore the other way round. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 14l5-5 5 5"/>
</svg>
