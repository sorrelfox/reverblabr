<!-- Restore, the maximise button of a maximised window (for the window's own
     title bar): a diamond, drawn at 22 pixels, as the desktop's own title
     bars draw it. The prototype has this and maximise the other way round. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 8l8-4 8 4-8 4z"/>
</svg>
