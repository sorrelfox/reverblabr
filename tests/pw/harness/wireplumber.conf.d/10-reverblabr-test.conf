#
# WirePlumber profile for the private test instance: the policy (default
# devices, linking of streams) without any hardware monitor, so no ALSA,
# Bluetooth or camera device is ever opened. It keeps no state between runs,
# and skips the services meant for real user sessions (device reservation,
# portals, logind).

wireplumber.profiles = {
  reverblabr-test = {
    inherits = [ policy, mixin.systemwide-session, mixin.stateless ]
  }
}
