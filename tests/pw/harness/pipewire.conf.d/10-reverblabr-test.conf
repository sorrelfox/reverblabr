#
# Test devices for the private PipeWire instance of the test harness. Every
# node is a null device, so no hardware is involved, and every name starts
# with "rbtest." so leaks into a real session are easy to spot.
#
# The stereo sink and source have the highest priority, so WirePlumber picks
# them as the defaults. Both sources rank above every sink: WirePlumber 0.5.13
# (Kubuntu 26.04's) still counts each sink's monitor when it picks the default
# source, and on a tie it would pick the stereo sink's.
#
# monitor.channel-volumes is left at its default (false), as on ALSA sinks: a
# sink's monitor ports carry what reaches the sink before its own volume.

context.objects = [
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.sink.stereo"
          node.description        = "Test sink (stereo)"
          media.class             = "Audio/Sink"
          audio.position          = [ FL FR ]
          priority.session        = 2000
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.sink.mono"
          node.description        = "Test sink (mono)"
          media.class             = "Audio/Sink"
          audio.position          = [ MONO ]
          priority.session        = 1000
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.sink.surround51"
          node.description        = "Test sink (5.1)"
          media.class             = "Audio/Sink"
          audio.position          = [ FL FR FC LFE RL RR ]
          priority.session        = 1000
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.sink.aux4"
          node.description        = "Test sink (4-channel AUX)"
          media.class             = "Audio/Sink"
          audio.position          = [ AUX0 AUX1 AUX2 AUX3 ]
          priority.session        = 1000
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.source.stereo"
          node.description        = "Test source (stereo)"
          media.class             = "Audio/Source/Virtual"
          audio.position          = [ FL FR ]
          priority.session        = 2200
      }
    }
    { factory = adapter
      args = {
          factory.name            = support.null-audio-sink
          node.name               = "rbtest.source.mono"
          node.description        = "Test source (mono)"
          media.class             = "Audio/Source/Virtual"
          audio.position          = [ MONO ]
          priority.session        = 2100
      }
    }
]
