#
# A minimal filter chain for the integration tests: a virtual sink whose audio
# is copied unchanged into a playback stream, as an equaliser would re-play it.
# Run it inside the harness with: pipewire -c <this file>

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Test filter chain"
          filter.graph = { nodes = [ { type = builtin name = copy label = copy } ] }
          audio.channels = 1
          capture.props = { node.name = "rbtest.fc.sink" media.class = Audio/Sink }
          playback.props = { node.name = "rbtest.fc.replay" }
      }
    }
]
