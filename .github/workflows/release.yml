#
# A release. A pushed tag vX.Y.Z has to be VERSION's (tools/check-release-tag.sh).
# The workflow makes the source tarball, builds and tests Reverblabr from that
# tarball on Fedora 44, builds the Fedora packages from it, and creates a draft
# GitHub Release with the tarball, the RPMs and SHA256SUMS, to be reviewed and
# published by hand. Publishing it sends the source RPM to COPR (copr.yml). The tarball gets a build
# provenance attestation, which `gh attestation verify` checks. The Release's
# notes are the version's entry in the AppStream data (tools/release-notes.py).
# "Run workflow" (workflow_dispatch) builds and tests without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sources:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag is VERSION's
        if: startsWith(github.ref, 'refs/tags/')
        run: tools/check-release-tag.sh
      - name: Tarball and checksum
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          mkdir dist
          git archive --format=tar --prefix="reverblabr-$version/" HEAD | xz -9 > "dist/reverblabr-$version.tar.xz"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/
          if-no-files-found: error

  # From the tarball, not the checkout: what is released is what is tested,
  # and a tree without git has to say the plain version.
  build:
    name: Build and test the tarball (Fedora 44)
    needs: sources
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 150
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: Unpack
        run: |
          dnf -y install xz tar > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
          tar -xf dist/reverblabr-*.tar.xz
          mv reverblabr-*/ src
      - name: Packages (tools/deps/fedora.txt)
        working-directory: src
        run: dnf -y install $(sed 's/#.*//' tools/deps/fedora.txt) > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      - name: Build
        working-directory: src
        run: |
          cmake --preset release
          cmake --build --preset release -- -j 4
      # **Not the cost tests** ("costs less than N % of a core", "fit quantum
      # 256"): they hold this code to the developer's machine, and a shared
      # runner is slower and busier than that (Dynamics took 0.60 % of a core
      # against its 0.5 % here). They run in every local release build.
      - name: Test
        working-directory: src
        run: ctest --preset release --output-junit ctest-junit.xml -E 'Costs?(LessThan|Little|Under|NoMore)|FitQuantum'
      # tools.versions lets a build from git add "+..." to the version; from
      # the tarball it has to be the plain one. The answer starts with the
      # application's name, which for the daemon is "reverblabr".
      - name: Every program says the release's version
        working-directory: src
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          for program in reverblabrd reverblabr-ctl reverblabr-plugin-host; do
            answer=$(build/release/bin/$program --version | head -n 1)
            echo "$program: $answer"
            [ "${answer##* }" = "$version" ] || { echo "::error::$program says \"$answer\", the release is $version"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            src/build/release/ctest-junit.xml
            src/build/release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # The Fedora packages, from the tarball the way COPR builds them: the
  # source RPM first (packaging/rpm/srpm.sh), then the binary RPMs from
  # nothing but that source RPM, with exactly its BuildRequires installed.
  rpm:
    name: RPM packages (Fedora 44)
    needs: sources
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 150
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: Tools
        run: dnf -y install rpm-build rpmlint xz tar 'dnf-command(builddep)' > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      - name: Source RPM
        run: |
          tar -xf dist/reverblabr-*.tar.xz
          mv reverblabr-*/ src
          src/packaging/rpm/srpm.sh dist/reverblabr-*.tar.xz rpm
      - name: BuildRequires
        run: dnf -y builddep rpm/*.src.rpm > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      # Four at a time, as in the build job: the runner's memory, not its
      # cores, is what runs out.
      - name: Binary RPMs
        run: rpmbuild --rebuild --define "_topdir $PWD/rpmbuild" --define "_smp_build_ncpus 4" rpm/*.src.rpm
      - name: rpmlint
        run: |
          find rpmbuild/RPMS -name '*.rpm' -exec cp -t rpm {} +
          rpmlint -r src/packaging/rpm/reverblabr.rpmlintrc rpm/reverblabr.spec rpm/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpm/*.rpm
          if-no-files-found: error

  # In a container that has seen no build: what dnf pulls in has to be
  # enough for every program to start.
  rpm-install:
    name: Install the RPMs (Fedora 44)
    needs: [sources, rpm]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: rpm, path: rpm }
      - name: Install, run and remove
        run: |
          dnf -y install xz tar > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
          tar -xf dist/reverblabr-*.tar.xz
          reverblabr-*/packaging/rpm/install-check.sh rpm

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sources, build, rpm, rpm-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the attestation: a short-lived signing certificate, and the
      # attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      # The packages go beside the tarball, and into the checksums with it.
      # Not the debug information: that is for COPR's own repository.
      - uses: actions/download-artifact@v4
        with: { name: rpm, path: rpm }
      - name: Packages and checksums
        run: |
          find rpm -name '*.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -exec cp -t dist {} +
          (cd dist && sha256sum -- *.tar.xz *.rpm > SHA256SUMS && cat SHA256SUMS)
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.rpm
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          python3 tools/release-notes.py "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Reverblabr $version" --notes-file notes.md
