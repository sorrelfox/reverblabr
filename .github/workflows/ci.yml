#
# Checks, the build and the whole test suite on Fedora 44, for main and for
# pull requests into it. Work on dev is checked on the developer's machine
# instead (docs/development.md, "Before a change goes in").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Bash with pipefail, so a failure in the middle of a pipe is a failure.
    shell: bash

jobs:
  # Sign-off, clean-room, licences and formatting: about a minute, so an
  # unsigned commit or a stray term doesn't wait for a build.
  checks:
    name: Sign-off, clean-room, licences, formatting
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools
        run: dnf -y install git clang-tools-extra reuse python3 diffutils > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      - uses: actions/checkout@v4
        with:
          # The sign-off and clean-room checks read the commits being added.
          fetch-depth: 0
      - name: The commits to check
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$BEFORE}
          # A run by hand, or a push that has nothing before it: everything
          # after the first commit.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Sign-off
        run: tools/ci/dco-check.sh "${{ steps.range.outputs.base }}"
      - name: Clean-room
        env:
          # The term list is a repository secret; without it the check passes
          # and says so.
          RB_FORBIDDEN_TERMS_BASE64: ${{ secrets.RB_FORBIDDEN_TERMS_BASE64 }}
        run: tools/ci/clean-room-check.sh "${{ steps.range.outputs.base }}"
      - name: Licences
        run: reuse lint
      - name: Formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run -Werror

  build-and-test:
    name: Build and test (Fedora 44)
    needs: checks
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    # A hung test would otherwise hold the runner for six hours. Tests that
    # need a compositor skip themselves here; the ones that need PipeWire
    # start a private one.
    timeout-minutes: 150
    steps:
      - name: Git
        run: dnf -y install git > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      - uses: actions/checkout@v4
      - name: Packages (tools/deps/fedora.txt)
        run: dnf -y install $(sed 's/#.*//' tools/deps/fedora.txt) > /tmp/dnf.log 2>&1 || { tail -40 /tmp/dnf.log; exit 1; }
      - name: Configure
        run: cmake --preset debug
      # Four at a time, not one per core: a C++ compiler is the hungriest
      # thing in the build, and running out of memory reads like a compile
      # error.
      - name: Build
        run: cmake --build --preset debug -- -j 4
      - name: Test
        run: ctest --preset debug --output-junit ctest-junit.xml
      # qmllint reports problems as warnings, so the job decides they are
      # errors.
      - name: QML lint
        run: |
          cmake --build --preset debug --target all_qmllint -- -j 4 2>&1 | tee qmllint.log
          if grep -q '^Warning:' qmllint.log; then
            echo "::error::qmllint found problems; see the warnings above."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/debug/ctest-junit.xml
            build/debug/Testing/Temporary/LastTest.log
            qmllint.log
          if-no-files-found: ignore
