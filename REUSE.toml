# SPDX-FileCopyrightText: 2026 Reverblabr contributors
# SPDX-License-Identifier: CC0-1.0

# Licensing for files that can't carry an SPDX header themselves.
# Everything else declares its licence in its own header; see ADR-0005.
version = 1

[[annotations]]
path = "CMakePresets.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Reverblabr contributors"
SPDX-License-Identifier = "CC0-1.0"

# The factory presets. They are data, not code: a JSON file cannot carry
# a comment, and these are meant to be copied, read and quoted freely.
[[annotations]]
path = "engine/presets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Reverblabr contributors"
SPDX-License-Identifier = "CC0-1.0"

# The panel widget's metadata, which Plasma reads as plain JSON with no room
# for a comment: data that describes the widget, free to copy like the
# factory presets.
[[annotations]]
path = "plasmoid/package/metadata.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Reverblabr contributors"
SPDX-License-Identifier = "CC0-1.0"

# The two typefaces the Reverblabr appearance draws with, bundled so
# the window looks the same on every machine rather than on the ones that
# happen to have them. Unmodified copies of the upstream files; see
# app/fonts/README.md for where each came from.
[[annotations]]
path = "app/fonts/NotoSans-*.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "app/fonts/JetBrainsMono-*.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# The version: one line, read by CMake and the release tools, with no
# room for a header.
[[annotations]]
path = "VERSION"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Reverblabr contributors"
SPDX-License-Identifier = "CC0-1.0"

# GitHub reads an issue template's front matter only from its first line, so
# the templates cannot start with a header either.
[[annotations]]
path = ".github/ISSUE_TEMPLATE/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Reverblabr contributors"
SPDX-License-Identifier = "CC0-1.0"
